name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Demo papers behave as expected
        run: |
          exampipe validate sample_data/demo_paper_clean.txt --course configs/demo_exam.yaml --strict
          ! exampipe validate sample_data/demo_paper_broken.txt --course configs/demo_exam.yaml
