name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Demo papers behave as expected
        run: |
          exampipe validate sample_data/demo_paper_clean.txt --course configs/demo_exam.yaml --strict
          ! exampipe validate sample_data/demo_paper_broken.txt --course configs/demo_exam.yaml
          exampipe validate sample_data/papers/demo_paper_01.txt --course configs/demo_exam.yaml --strict
          exampipe build "sample_data/papers/*.txt" --course configs/demo_exam.yaml --out build_out
          test "$(find build_out -name '*.xlsx' | wc -l)" -eq 12
          ! exampipe build sample_data/demo_paper_broken.txt --course configs/demo_exam.yaml --out should_not_exist
          test ! -e should_not_exist
