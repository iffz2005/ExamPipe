[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exampipe"
version = "0.1.0"
description = "Config-driven validation and processing toolkit for exam question banks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
exampipe = "exampipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
